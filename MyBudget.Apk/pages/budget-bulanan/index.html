<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Budget Bulanan — MyBudget</title>
<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#748099;--line:#e5eaf2;--blue:#315efb;--green:#138a58;--red:#c24141;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:10px 12px 100px}.head{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 10px}.head h1{font-size:22px;margin:0}.head small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #17203308}.summary{background:linear-gradient(145deg,#fff,#f4f7ff);border-color:#dfe7ff}.summary .label{color:var(--blue);font-size:12px;font-weight:750}.today{font-size:clamp(30px,8vw,40px);font-weight:850;color:#244bd4;line-height:1.15;margin:4px 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:15px;margin-top:2px}.stat .red{color:var(--red)}.stat .green{color:var(--green)}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ef;border-radius:10px;padding:10px;background:#fff;color:var(--ink);font:inherit;min-width:0}.toolbar select{width:auto;flex:1}.tabs{display:flex;background:#edf1f8;padding:4px;border-radius:12px;gap:4px}.tabs button{flex:1;border:0;background:transparent;padding:9px 5px;border-radius:9px;color:var(--muted);font-weight:750}.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px #17203312}.day{margin:12px 0 6px}.day-title{display:flex;justify-content:space-between;align-items:center;padding:8px 3px;border-bottom:1px solid var(--line);font-weight:800}.day-title small{font-weight:500;color:var(--muted)}.tx{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #edf0f5}.tx:last-child{border-bottom:0}.tx-icon{width:36px;height:36px;border-radius:11px;background:#f1f4fa;display:grid;place-items:center;font-size:17px}.tx-info{flex:1;min-width:0}.tx-info b{display:block;font-size:14px;overflow-wrap:anywhere}.tx-info small{color:var(--muted);font-size:11px}.tx-amount{text-align:right;font-weight:800;white-space:nowrap}.expense{color:var(--red)}.income{color:var(--green)}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:22px;width:62px;height:62px;border:0;border-radius:50%;background:#315efb;color:#fff;font-size:32px;box-shadow:0 8px 22px #315efb55;z-index:20}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 12px;border-radius:10px;font-weight:750}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.danger{color:var(--red)}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:4px}.field textarea{min-height:60px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.overlay{display:none;position:fixed;inset:0;background:#10182866;z-index:50;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,620px);max-height:90dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 28px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sheet-head h2{font-size:18px;margin:0}.close{border:0;background:#f1f3f8;border-radius:50%;width:34px;height:34px;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.report-box{background:#f7f9fd;border:1px solid var(--line);border-radius:11px;padding:10px}.report-box small{color:var(--muted);font-size:11px}.report-box b{display:block;margin-top:4px;font-size:14px;overflow-wrap:anywhere}.category-chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:20px;background:#f0f3fa;font-size:12px}.notice{font-size:12px;color:var(--muted);line-height:1.5}@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:85vh}.summary{padding:18px}.row{gap:12px}}
</style></head><body><main class="wrap">
<div class="head"><div><h1>Budget Bulanan</h1><small id="monthLabel"></small></div><button class="btn" id="settingsBtn">⚙ Budget</button></div>
<section class="card summary"><div class="label">Sisa Budget Bulanan</div><div class="today" id="todayBudget">—</div><div class="stats"><div class="stat">Total Pengeluaran<b class="red" id="totalExpense">—</b></div><div class="stat">Total Pemasukan<b class="green" id="totalIncome">—</b></div></div><div class="notice" id="budgetMeta" style="margin-top:10px"></div></section>
<section class="card"><div class="toolbar"><select id="currencyFilter" aria-label="Mata uang"><option value="IDR">IDR (Rp)</option><option value="RM">MYR (RM)</option><option value="USD">USD ($)</option></select><button class="btn" id="backupBtn">Backup</button><button class="btn" id="restoreBtn">Restore</button><input id="restoreFile" type="file" accept="application/json" hidden></div></section>
<section class="card"><div class="tabs"><button class="active" data-period="daily">Harian</button><button data-period="weekly">Mingguan</button><button data-period="monthly">Bulanan</button></div><div class="toolbar" style="margin-top:9px"><button class="btn" id="prevPeriod">‹</button><strong id="periodLabel" style="flex:1;text-align:center"></strong><button class="btn" id="nextPeriod">›</button><button class="btn" id="todayPeriod">Hari ini</button></div><div id="reportSummary" class="report-grid" style="margin-top:10px"></div></section>
<section class="card"><div class="head" style="margin:0 0 4px"><b>Riwayat Transaksi</b><button class="btn" id="categoryBtn">Kategori</button></div><div id="transactionList"></div></section>
</main><button class="fab" id="addBtn" aria-label="Tambah transaksi">＋</button>
<div class="overlay" id="budgetSetup"><div class="sheet"><div class="sheet-head"><h2>Atur Budget Bulanan</h2></div><p class="notice">Atur saldo budget bulanan dan mata uang. Budget harian dihitung dari sisa budget dibagi sisa hari dalam bulan ini.</p><form id="budgetForm"><div class="field"><label>Saldo Budget Bulanan</label><input id="budgetAmount" type="number" min="0" step="any" required placeholder="Masukkan budget"></div><div class="field"><label>Mata uang</label><select id="budgetCurrency"><option value="IDR">IDR (Rupiah)</option><option value="RM">MYR (Ringgit)</option><option value="USD">USD</option></select></div><div class="actions"><button class="btn primary" type="submit">Simpan Budget</button></div></form></div></div>
<div class="overlay" id="txOverlay"><div class="sheet"><div class="sheet-head"><h2 id="txTitle">Tambah Transaksi</h2><button class="close" data-close="txOverlay">×</button></div><form id="txForm"><div class="row"><div class="field"><label>Jenis transaksi</label><select id="txType"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div><div class="field"><label>Tanggal</label><input id="txDate" type="date" required></div></div><div class="field"><label>Nama transaksi</label><input id="txName" maxlength="70" required placeholder="Contoh: Belanja dapur"></div><div class="row"><div class="field"><label>Kategori</label><select id="txCategory"></select></div><div class="field"><label>Nominal</label><input id="txAmount" type="number" min="0.01" step="any" required placeholder="0"></div></div><div class="field"><label id="accountLabel">Asal rekening</label><select id="txAccount" required></select></div><div class="field"><label>Catatan (opsional)</label><textarea id="txNote" maxlength="200"></textarea></div><div class="actions"><button class="btn primary" type="submit">Simpan Transaksi</button><button class="btn" type="button" data-close="txOverlay">Batal</button></div></form></div></div>
<div class="overlay" id="categoryOverlay"><div class="sheet"><div class="sheet-head"><h2>Kategori Pengeluaran & Pemasukan</h2><button class="close" data-close="categoryOverlay">×</button></div><div class="row"><div class="field"><label>Nama kategori</label><input id="newCategory" placeholder="Nama kategori"></div><div class="field"><label>Jenis</label><select id="newCategoryType"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div></div><button class="btn primary" id="addCategory">Tambah Kategori</button><div id="categoryList" style="margin-top:12px"></div></div></div>
<script src="../../js/page-shell.js?v=2"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),ACC='mybudget_accounts_v1',KEY='mybudget_budget_bulanan_v1';let data={settings:null,transactions:[],categories:{expense:['Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Hiburan','Lainnya'],income:['Gaji','Bonus','Usaha','Investasi','Lainnya']}},accounts=[],period='daily',anchor=new Date(),editing=null;
const today=()=>new Date().toISOString().slice(0,10),money=v=>{const c=data.settings?.currency||'IDR';return (c==='IDR'?'Rp':c==='RM'?'RM ':'$')+new Intl.NumberFormat('id-ID',{minimumFractionDigits:0,maximumFractionDigits:c==='IDR'?0:2}).format(Number(v||0))},parseDate=s=>new Date(s+'T12:00:00'),ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),monthDays=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),sameMonth=(s,d)=>s.slice(0,7)===ymd(d).slice(0,7),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')data={...data,...x}}catch{}try{const a=JSON.parse(localStorage.getItem(ACC)||'[]');accounts=Array.isArray(a)?a:[]}catch{accounts=[]}if(!data.settings){$('budgetSetup').classList.add('show')}render()}
function persistAccounts(){localStorage.setItem(ACC,JSON.stringify(accounts));}
function adjustAccount(id,amount,sign){if(!id)return;const a=accounts.find(x=>x.id===id);if(!a)return;const c=data.settings.currency;if(a.currency!==c)return;const delta=amount*sign;a.sourceAmount=Math.max(0,Number(a.sourceAmount||0)+delta);a.amount=Math.max(0,Math.round(Number(a.amount||0)+delta*Number(a.rateToIdr||1)));persistAccounts()}
function applyTx(t,sign){if(t.type==='expense')adjustAccount(t.accountId,t.amount,-sign);else adjustAccount(t.accountId,t.amount,sign)}
function setAccounts(){const c=data.settings.currency,opts=accounts.filter(a=>a.currency===c);$('txAccount').innerHTML='<option value="">Pilih rekening '+c+'</option>'+opts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+money(a.sourceAmount)+'</option>').join('');if(!opts.length)$('txAccount').innerHTML='<option value="">Belum ada rekening '+c+'</option>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function render(){if(!data.settings)return;const now=new Date(),c=data.settings.currency,monthStart=ymd(new Date(now.getFullYear(),now.getMonth(),1)),monthEnd=ymd(new Date(now.getFullYear(),now.getMonth()+1,0)),daysLeft=monthDays(now)-now.getDate()+1,monthTx=data.transactions.filter(t=>sameMonth(t.date,now)&&t.currency===c),spent=monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),income=monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),remaining=Number(data.settings.amount)-spent;const perDay=Math.max(0,remaining)/Math.max(1,daysLeft);$('monthLabel').textContent=now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})+' · '+c;$('todayBudget').textContent=money(perDay);$('totalExpense').textContent=money(spent);$('totalIncome').textContent=money(income);$('budgetMeta').textContent='Sisa budget: '+money(remaining)+' · '+daysLeft+' hari tersisa · Budget awal: '+money(data.settings.amount);$('currencyFilter').value=c;renderReport();renderTransactions();setAccounts()}
function periodRange(){const d=new Date(anchor),start=new Date(d),end=new Date(d);if(period==='daily'){start.setHours(0,0,0,0);end.setHours(0,0,0,0)}else if(period==='weekly'){const offset=(d.getDay()+6)%7;start.setDate(d.getDate()-offset);end.setTime(start.getTime());end.setDate(start.getDate()+6)}else{start.setDate(1);end.setMonth(start.getMonth()+1,0)}return [ymd(start),ymd(end)]}
function renderReport(){const [a,b]=periodRange(),items=data.transactions.filter(t=>t.currency===data.settings.currency&&t.date>=a&&t.date<=b),out=items.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),inc=items.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);$('periodLabel').textContent=period==='daily'?parseDate(a).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):period==='weekly'?parseDate(a).toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' – '+parseDate(b).toLocaleDateString('id-ID',{day:'numeric',month:'short'}):parseDate(a).toLocaleDateString('id-ID',{month:'long',year:'numeric'});$('reportSummary').innerHTML='<div class="report-box"><small>Pemasukan</small><b class="income">'+money(inc)+'</b></div><div class="report-box"><small>Pengeluaran</small><b class="expense">'+money(out)+'</b></div><div class="report-box"><small>Selisih</small><b>'+money(inc-out)+'</b></div>'}
function renderTransactions(){const host=$('transactionList'),c=data.settings.currency,tx=data.transactions.filter(t=>t.currency===c&&sameMonth(t.date,new Date())).sort((a,b)=>b.date.localeCompare(a.date));host.innerHTML='';if(!tx.length){host.innerHTML='<div class="empty">Belum ada transaksi bulan ini.<br>Tekan tombol + untuk mencatat.</div>';return}const groups={};tx.forEach(t=>(groups[t.date]??=[]).push(t));Object.keys(groups).sort().reverse().forEach(date=>{const group=document.createElement('div');group.className='day';const total=groups[date].reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);const h=document.createElement('div');h.className='day-title';h.innerHTML='<span>'+parseDate(date).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+'</span><small>'+(total>=0?'+':'')+money(total)+'</small>';group.append(h);groups[date].forEach(t=>{const row=document.createElement('div');row.className='tx';const icon=document.createElement('div');icon.className='tx-icon';icon.textContent=t.type==='income'?'↙':'↗';const info=document.createElement('div');info.className='tx-info';info.innerHTML='<b>'+esc(t.name)+'</b><small>'+esc(t.category)+' · '+esc(accountName(t.accountId))+'</small>';const amt=document.createElement('div');amt.className='tx-amount '+(t.type==='income'?'income':'expense');amt.textContent=(t.type==='income'?'+':'−')+money(t.amount);row.append(icon,info,amt);row.addEventListener('click',()=>editTx(t.id));group.append(row)});host.append(group)})}
function accountName(id){return accounts.find(a=>a.id===id)?.name||'Rekening tidak tersedia'}
function openTx(t){editing=t?.id||null;$('txTitle').textContent=t?'Edit Transaksi':'Tambah Transaksi';$('txType').value=t?.type||'expense';$('txDate').value=t?.date||today();$('txName').value=t?.name||'';$('txAmount').value=t?.amount??'';$('txNote').value=t?.note||'';setAccounts();$('txAccount').value=t?.accountId||'';fillCategories();$('txCategory').value=t?.category||data.categories[$('txType').value][0];$('accountLabel').textContent=$('txType').value==='expense'?'Asal rekening':'Tujuan rekening';$('txOverlay').classList.add('show')}
function editTx(id){const t=data.transactions.find(x=>x.id===id);if(t)openTx(t)}
function fillCategories(){$('txCategory').innerHTML=(data.categories[$('txType').value]||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}
$('txType').addEventListener('change',()=>{$('accountLabel').textContent=$('txType').value==='expense'?'Asal rekening':'Tujuan rekening';fillCategories()});
$('txForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('txAmount').value),accountId=$('txAccount').value,acc=accounts.find(a=>a.id===accountId),type=$('txType').value;if(!acc||acc.currency!==data.settings.currency){alert('Pilih rekening dengan mata uang yang sama dengan filter budget.');return}if(!(amount>0)){alert('Nominal harus lebih dari nol.');return}const next={id:editing||uid(),type,date:$('txDate').value,name:$('txName').value.trim(),category:$('txCategory').value,amount,currency:data.settings.currency,accountId,note:$('txNote').value.trim()};if(editing){const old=data.transactions.find(t=>t.id===editing);if(old)applyTx(old,-1);data.transactions=data.transactions.filter(t=>t.id!==editing)}data.transactions.push(next);applyTx(next,1);save();$('txOverlay').classList.remove('show');render()});
$('addBtn').onclick=()=>openTx();$('settingsBtn').onclick=()=>{$('budgetAmount').value=data.settings?.amount||'';$('budgetCurrency').value=data.settings?.currency||'IDR';$('budgetSetup').classList.add('show')};
$('budgetForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('budgetAmount').value);if(!(amount>0)){alert('Masukkan budget lebih dari nol.');return}const currency=$('budgetCurrency').value;data.settings={amount,currency};save();$('budgetSetup').classList.remove('show');render()});
$('currencyFilter').addEventListener('change',e=>{if(data.settings){data.settings.currency=e.target.value;save();render()}});
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;anchor=new Date();document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));renderReport()});
$('prevPeriod').onclick=()=>{if(period==='daily')anchor.setDate(anchor.getDate()-1);else if(period==='weekly')anchor.setDate(anchor.getDate()-7);else anchor.setMonth(anchor.getMonth()-1);renderReport()};$('nextPeriod').onclick=()=>{if(period==='daily')anchor.setDate(anchor.getDate()+1);else if(period==='weekly')anchor.setDate(anchor.getDate()+7);else anchor.setMonth(anchor.getMonth()+1);renderReport()};$('todayPeriod').onclick=()=>{anchor=new Date();renderReport()};
$('categoryBtn').onclick=()=>{$('categoryOverlay').classList.add('show');renderCategories()};function renderCategories(){const host=$('categoryList');host.innerHTML='';['expense','income'].forEach(type=>{const h=document.createElement('b');h.textContent=type==='expense'?'Pengeluaran':'Pemasukan';host.append(h);(data.categories[type]||[]).forEach(name=>{const line=document.createElement('div');line.className='tx';const label=document.createElement('div');label.className='tx-info';label.textContent=name;const del=document.createElement('button');del.className='btn danger';del.textContent='Hapus';del.onclick=()=>{if(confirm('Hapus kategori '+name+'?')){data.categories[type]=data.categories[type].filter(x=>x!==name);save();renderCategories();fillCategories()}};line.append(label,del);host.append(line)})})}
$('addCategory').onclick=()=>{const name=$('newCategory').value.trim(),type=$('newCategoryType').value;if(!name)return;if(!data.categories[type].includes(name))data.categories[type].push(name);$('newCategory').value='';save();renderCategories();fillCategories()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));
$('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,data,accounts},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mybudget-budget-bulanan-backup.json';a.click();URL.revokeObjectURL(url)};
$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x.data||!Array.isArray(x.data.transactions)||!Array.isArray(x.accounts))throw Error('Format backup tidak sesuai');data=x.data;accounts=x.accounts;save();persistAccounts();render();alert('Backup berhasil dipulihkan.')}catch(err){alert('File backup tidak valid.')}e.target.value=''};
window.addEventListener('storage',e=>{if(e.key===ACC){try{accounts=JSON.parse(localStorage.getItem(ACC)||'[]')}catch{accounts=[]}render()}});
load();
})();
</script></body></html>
