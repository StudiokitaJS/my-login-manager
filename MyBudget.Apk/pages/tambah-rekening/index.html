<section id="addPage" class="page"><h1 class="page-title">Tambah rekening</h1><p class="sub">Catat rekening dan saldo yang ingin dipantau.</p><section class="card"><div class="section-head"><h2 id="formTitle">Informasi rekening</h2><span class="badge">INPUT DATA</span></div>
<form id="accountForm"><div class="field"><label for="name">Nama rekening</label><input id="name" maxlength="70" placeholder="Contoh: BRI, Binance, Cash" required></div>
<div class="field"><label for="amount">Nominal saldo (Rp)</label><div class="money-row"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" required><button type="button" class="calc-btn" id="openCalc" aria-label="Buka kalkulator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/></svg></button></div></div>
<div class="form-actions"><button class="primary-btn" id="saveBtn" type="submit">＋ Simpan rekening</button><button class="secondary-btn" id="cancelEdit" type="button" hidden>Batal</button></div></form><p class="hint">Nominal dapat diisi hingga 16 digit. Ikon kalkulator membantu menghitung saldo sebelum disimpan.</p></section></section>
