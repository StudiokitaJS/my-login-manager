<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Liquidasi — MyBudget</title>
<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#748099;--line:#e5eaf2;--blue:#315efb;--green:#12845b;--red:#c24141;--amber:#fff7e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}.app-header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:18px;font-weight:800;text-decoration:none}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#eaf0ff;color:var(--blue)}.menu-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);display:grid;place-items:center}.menu-panel{display:none;position:fixed;z-index:30;right:12px;top:64px;width:min(250px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:0 12px 35px #17203322}.menu-panel.open{display:block}.menu-panel a{display:block;padding:11px 12px;border-radius:9px;color:var(--ink);text-decoration:none}.wrap{max-width:800px;margin:auto;padding:5px 8px 16px}.intro{margin:0 2px 5px}.intro h1{font-size:22px;margin:0 0 2px}.muted,.hint{color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin:5px 0}.card h2{font-size:14px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:3px}.field input,.field select{width:100%;min-width:0;border:1px solid #dce3ef;border-radius:8px;padding:7px 8px;font:inherit;background:#fff;color:var(--ink)}.entry-row{display:flex;gap:5px}.entry-row input{flex:1;min-width:0}.refresh-btn{width:38px;flex:0 0 38px;border:1px solid #cbd7ff;background:#eef3ff;color:#315efb;border-radius:9px;font-size:19px;font-weight:800}.refresh-btn:disabled{opacity:.55}.field.hidden{display:none}.side{display:flex;gap:7px}.side button{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;color:var(--muted)}.side button.active[data-side=Long]{background:#e8f8f0;border-color:#8bd4b2;color:var(--green)}.side button.active[data-side=Short]{background:#fff0f0;border-color:#efb1b1;color:var(--red)}.hero{border-radius:12px;padding:10px;background:#eef3ff;border:1px solid #d5e0ff}.hero small{color:#53648e;font-weight:700}.hero strong{display:block;font-size:clamp(26px,6vw,36px);line-height:1.25;margin:5px 0;color:#244bd4;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}.metric{padding:8px;border:1px solid var(--line);border-radius:11px;background:#f8faff;min-width:0}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:16px;margin-top:3px;overflow-wrap:anywhere}.notice{padding:12px;border:1px solid #f0dca5;background:var(--amber);color:#624c13;border-radius:11px;font-size:12px;line-height:1.6}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;color:var(--ink);font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.hint{line-height:1.55}.formula{background:#f7f9fd;border-radius:10px;padding:11px;margin-top:10px;font-size:13px;overflow-wrap:anywhere}@media(max-width:480px){.card{padding:9px}.grid{gap:6px}.field input,.field select{padding:8px}.metrics{gap:6px}.metric{padding:8px}.metric strong{font-size:14px}}
</style></head><body>

<main class="wrap"><div class="intro"><h1>Kalkulator Liquidasi</h1></div>
<section class="card"><h2>1. Data saat entry</h2><div class="grid">
<div class="field"><label for="pair">Pair</label><input id="pair" value="BTCUSDT" maxlength="20"></div>
<div class="field"><label for="entry">Harga entry (USDT)</label><div class="entry-row"><input id="entry" type="number" min="0" step="any" value="80000"><button type="button" class="refresh-btn" id="priceBtn" aria-label="Perbarui harga entry" title="Ambil harga pasar terbaru">↻</button></div><div class="hint" id="priceStatus"></div></div>
<div class="field"><label>Arah posisi</label><div class="side"><button type="button" data-side="Long" class="active">LONG</button><button type="button" data-side="Short">SHORT</button></div></div>
<div class="field"><label for="amount">Amount / nilai posisi (USDT)</label><input id="amount" type="number" min="0" step="any" value="100"></div>
<div class="field"><label for="leverage">Leverage</label><select id="leverage"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option><option>20</option><option>25</option><option>50</option><option selected>100</option><option>125</option></select></div>
<div class="field"><label for="maint">Maintenance margin (%)</label><input id="maint" type="number" min="0" max="20" step="any" value="0.5"></div>
<div class="field"><label for="fee">Cadangan fee penutupan (%)</label><input id="fee" type="number" min="0" max="10" step="any" value="0.05"></div>
<div class="field"><label for="mode">Mode margin</label><select id="mode"><option value="isolated">Isolated</option><option value="cross">Cross</option></select></div><div class="field" id="walletField"><label for="wallet">Saldo wallet tersedia (USDT)</label><input id="wallet" type="number" min="0" step="any" value="0"></div>
</div><div class="actions"><button class="btn primary" id="resetBtn">Reset</button></div></section>
<section class="card"><h2>Estimasi harga likuidasi</h2><div class="hero"><small>HARGA LIKUIDASI SIMULASI</small><strong id="liq">—</strong><div id="distance" class="muted">—</div></div><div class="metrics"><div class="metric"><small>Perkiraan rugi saat ambang</small><strong id="loss">—</strong></div><div class="metric"><small>Sisa margin dikurangi asumsi maintenance & fee</small><strong id="remaining">—</strong></div></div></section>

</main>
<script src="../../js/page-shell.js?v=2"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const STORE='mybudget_liquidasi_v2';let side='Long';const menuBtn=$('menuBtn'),menuPanel=$('menuPanel');if(menuBtn&&menuPanel){menuBtn.addEventListener('click',()=>{const open=menuPanel.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!menuPanel.contains(e.target)&&!menuBtn.contains(e.target)){menuPanel.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}})}const fields=['pair','entry','amount','leverage','maint','fee','mode','wallet'];function save(){try{localStorage.setItem(STORE,JSON.stringify({side,values:Object.fromEntries(fields.map(id=>[id,$(id).value]))}))}catch(e){}}function restore(){try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.values){fields.forEach(id=>{if(saved.values[id]!==undefined)$(id).value=saved.values[id]});if(saved.side==='Long'||saved.side==='Short')side=saved.side;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x.dataset.side===side));}}catch(e){}}const n=id=>Number($(id).value);const f=(v,d=4)=>Number.isFinite(v)?v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d}):'—';const money=v=>f(v,6)+' USDT';function calc(){const p=n('entry'),a=n('amount'),l=n('leverage'),mm=n('maint')/100,fee=n('fee')/100,wallet=n('wallet');const valid=p>0&&a>0&&l>=1&&mm>=0&&mm<1&&fee>=0&&wallet>=0&&Number.isFinite(p+a+l+mm+fee+wallet);if(!valid){['margin','notional','qty','levView','qtyFormula','liq','distance','loss','remaining'].forEach(id=>$(id).textContent='Periksa input');return}const m=a/l,q=a/p,marginPool=m+($('mode').value==='cross'?wallet:0),move=Math.max(0,marginPool/a-mm-fee),liq=side==='Long'?p*(1-move):p*(1+move),loss=a*move; $('margin').textContent=money(m);$('marginDesc').textContent='Amount '+money(a)+' ÷ leverage '+l+'x. '+($('mode').value==='cross'?'Saldo wallet '+money(wallet)+' ikut simulasi Cross.':'Margin teori sebelum fee; mode Isolated.');$('notional').textContent=money(a);$('qty').textContent=f(q,8)+' '+$('pair').value.replace(/USDT$/i,'');$('levView').textContent=l+'x';$('qtyFormula').textContent=f(a,4)+' ÷ '+f(p,2)+' = '+f(q,8);$('formula').innerHTML='<b>Rumus:</b> Margin awal = Amount ÷ Leverage = '+f(a,4)+' ÷ '+l+' = <b>'+f(m,6)+' USDT</b>.<br>Jumlah coin = Amount ÷ harga entry = '+f(a,4)+' ÷ '+f(p,2)+' = <b>'+f(q,8)+'</b>.<br>Ambang gerak harga model = 1/leverage − maintenance margin − fee = '+f(100/l,3)+'% − '+f(mm*100,3)+'% − '+f(fee*100,3)+'%.';$('liq').textContent=liq>0?f(liq,2)+' USDT':'Tidak valid pada rumus sederhana';$('distance').textContent='Jarak dari entry: '+f(move*100,3)+'% · '+side+' · '+$('pair').value.toUpperCase();$('loss').textContent=money(loss);$('remaining').textContent=money(Math.max(0,marginPool-loss));save();}document.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{side=b.dataset.side;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x===b));calc()}));document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calc));$('mode').addEventListener('change',()=>{calc()});$('priceBtn').addEventListener('click',async()=>{const b=$('priceBtn'),status=$('priceStatus'),symbol=$('pair').value.trim().toUpperCase();if(!/^[A-Z0-9]{5,20}$/.test(symbol)){status.textContent='Pair tidak valid.';return}b.disabled=true;status.textContent='Mengambil harga pasar…';try{const response=await fetch('https://fapi.binance.com/fapi/v1/ticker/price?symbol='+encodeURIComponent(symbol));if(!response.ok)throw new Error('API');const data=await response.json();if(!data.price||!Number.isFinite(Number(data.price)))throw new Error('price');$('entry').value=Number(data.price);status.textContent='Harga diperbarui.';calc()}catch(e){status.textContent='Harga otomatis gagal (jaringan/API). Silakan isi harga entry manual.'}finally{b.disabled=false}});$('resetBtn').addEventListener('click',()=>{Object.entries({pair:'BTCUSDT',entry:'80000',amount:'100',leverage:'100',maint:'0.5',fee:'0.05',mode:'isolated',wallet:'0'}).forEach(([k,v])=>$(k).value=v);side='Long';document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x.dataset.side===side));calc();save()});restore();$('mode').dispatchEvent(new Event('change'));calc()})();
</script>
</body></html>
