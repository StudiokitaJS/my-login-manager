<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb">
<title>MyBudget</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
<header class="topbar">
<button class="brand home-brand" id="homeBtn" type="button" aria-label="Beranda"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 17 4M7 4h10v10"/></svg></span><span>MyBudget</span></button>
<button class="icon-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div id="pageMount"><div class="empty">Memuat halaman…</div></div>
</main>
<nav class="menu" id="menu" aria-label="Menu aplikasi">
<button data-page="list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8h9M8 12h9M8 16h5"/></svg><span class="menu-label">Rekening</span></button>
<button data-page="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="menu-label">Tambah Rekening</span></button>
<button data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5 21 15l-2 4-2-1a8 8 0 0 1-2 1l-.5 2h-4L10 19a8 8 0 0 1-2-1l-2 1-2-4 2-1v-2l-2-1 2-4 2 1a8 8 0 0 1 2-1l.5-2h4L15 7a8 8 0 0 1 2 1l2-1 2 4-2 1z"/></svg><span class="menu-label">Setting</span></button>
<button id="aboutBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span class="menu-label">About</span></button></nav>
<div class="overlay" id="calcOverlay"><div class="sheet"><div class="sheet-head"><h3>Kalkulator nominal</h3><button class="icon-btn" id="closeCalc" aria-label="Tutup kalkulator"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="calc-display" id="calcDisplay">0</div><div class="keypad" id="keypad"><button class="key op" data-key="C">C</button><button class="key op" data-key="back">⌫</button><button class="key op" data-key="%">%</button><button class="key op" data-key="/">÷</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key op" data-key="*">×</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key op" data-key="-">−</button><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key op" data-key="+">+</button><button class="key wide" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equals" data-key="=">=</button></div><button class="primary-btn" style="margin-top:12px" id="useCalc">Gunakan nominal</button></div></div>
<div class="overlay" id="messageOverlay"><div class="sheet"><div class="sheet-head"><h3 id="messageTitle">Informasi</h3><button class="icon-btn" id="closeMessage" aria-label="Tutup"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="messageText" style="color:var(--muted);line-height:1.6"></p><button class="primary-btn" id="messageOk">Mengerti</button></div></div>
<div class="toast" id="toast"></div>
<script type="module">
const pageFiles=['pages/beranda/index.html','pages/rekening/index.html','pages/laporan-bulanan/index.html','pages/sallary/index.html','pages/setting/index.html','pages/about/index.html'];
try{const html=await Promise.all(pageFiles.map(async path=>{const response=await fetch(path);if(!response.ok)throw new Error('Gagal memuat '+path);return response.text()}));document.getElementById('pageMount').innerHTML=html.join('\n');await import('./js/app.js')}catch(error){document.getElementById('pageMount').innerHTML='<section class="card"><h2>Halaman gagal dimuat</h2><p class="hint">Periksa koneksi dan struktur folder halaman, lalu muat ulang.</p></section>';console.error(error)}
</script>
</body></html>
