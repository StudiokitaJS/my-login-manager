<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>MyBudget</title>
  <link rel="stylesheet" href="css/style.css?v=transferfix2">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="brand home-brand" id="homeBtn" type="button" aria-label="Beranda">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17 17 4M7 4h10v10"/>
          </svg>
        </span>
        <span>MyBudget</span>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </header>

    <div id="pageMount">
      <div class="empty">Memuat halaman…</div>
    </div>
  </main>

  <nav class="menu" id="menu" aria-label="Menu aplikasi">
    <button data-page="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg>
      <span class="menu-label">Beranda</span>
    </button>
    <button data-page="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5 21 15l-2 4-2-1a8 8 0 0 1-2 1l-.5 2h-4L10 19a8 8 0 0 1-2-1l-2 1-2-4 2-1v-2l-2-1 2-4 2 1a8 8 0 0 1 2-1l.5-2h4L15 7a8 8 0 0 1 2 1l2-1 2 4-2 1z"/></svg>
      <span class="menu-label">Setting</span>
    </button>
    <button id="aboutBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span class="menu-label">About</span>
    </button>
  </nav>

  <div class="overlay" id="calcOverlay">
    <div class="sheet">
      <div class="sheet-head">
        <h3>Kalkulator nominal</h3>
        <button class="icon-btn" id="closeCalc" type="button" aria-label="Tutup kalkulator">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="keypad" id="keypad">
        <button class="key op" data-key="C" type="button">C</button>
        <button class="key op" data-key="back" type="button">⌫</button>
        <button class="key op" data-key="%" type="button">%</button>
        <button class="key op" data-key="/" type="button">÷</button>
        <button class="key" data-key="7" type="button">7</button>
        <button class="key" data-key="8" type="button">8</button>
        <button class="key" data-key="9" type="button">9</button>
        <button class="key op" data-key="*" type="button">×</button>
        <button class="key" data-key="4" type="button">4</button>
        <button class="key" data-key="5" type="button">5</button>
        <button class="key" data-key="6" type="button">6</button>
        <button class="key op" data-key="-" type="button">−</button>
        <button class="key" data-key="1" type="button">1</button>
        <button class="key" data-key="2" type="button">2</button>
        <button class="key" data-key="3" type="button">3</button>
        <button class="key op" data-key="+" type="button">+</button>
        <button class="key wide" data-key="0" type="button">0</button>
        <button class="key" data-key="." type="button">.</button>
        <button class="key equals" data-key="=" type="button">=</button>
      </div>
      <button class="primary-btn calc-use-btn" id="useCalc" type="button">Gunakan nominal</button>
    </div>
  </div>

  <div class="overlay" id="messageOverlay">
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="messageTitle">Informasi</h3>
        <button class="icon-btn" id="closeMessage" type="button" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p id="messageText" class="message-text"></p>
      <button class="primary-btn" id="messageOk" type="button">Mengerti</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    const pageFiles = [
      'pages/beranda/index.html',
      'pages/rekening/index.html',
      'pages/tambah-rekening/index.html',
      'pages/laporan-bulanan/index.html',
      'pages/sallary/index.html',
      'pages/setting/index.html',
      'pages/about/index.html',
      'pages/my-ip/index.html'
    ];

    const pageMount = document.getElementById('pageMount');

    function showLoadError(error) {
      const card = document.createElement('section');
      card.className = 'card';
      const title = document.createElement('h2');
      title.textContent = 'Aplikasi gagal dimuat';
      const message = document.createElement('p');
      message.className = 'hint';
      message.textContent = error && error.message
        ? error.message
        : 'Periksa koneksi internet, lalu muat ulang halaman.';
      card.append(title, message);
      pageMount.replaceChildren(card);
      console.error('MyBudget load error:', error);
    }

    async function startApp() {
      try {
        const pages = await Promise.all(pageFiles.map(async (path) => {
          const response = await fetch(path + '?v=home-layout-20261107');
          if (!response.ok) {
            throw new Error('Gagal memuat ' + path + ' (HTTP ' + response.status + ')');
          }
          return response.text();
        }));

        pageMount.innerHTML = pages.join('\n');
        history.replaceState({ mybudgetPage: 'home' }, '', location.pathname + '#home');

        try {
          await import('./js/app.js?v=bitcoin-outline-fix-20261107');
        } catch (error) {
          throw new Error('JavaScript aplikasi bermasalah: ' + (error.message || error));
        }
      } catch (error) {
        showLoadError(error);
      }
    }

    startApp();
  </script>
</body>
</html>
